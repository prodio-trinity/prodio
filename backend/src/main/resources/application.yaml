server:
  port: ${SERVER_PORT:8080}

spring:
  profiles:
    default: local

  config:
    import:
      - optional:file:../.env[.properties]

  application:
    name: ${SPRING_APPLICATION_NAME:prodio}

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    repair-on-migrate: true

  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
      republish-outstanding-events-on-restart: true

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, threaddump
  metrics:
    tags:
      application: prodio-backend

prodio:
  cors:
    allowed-origins: ${PRODIO_CORS_ALLOWED_ORIGINS:http://localhost:3000}

  security:
    csrf:
      secure-cookie: ${PRODIO_CSRF_SECURE_COOKIE:false}

  sms:
    coolsms:
      api-key: ${COOLSMS_API_KEY:}
      api-secret: ${COOLSMS_API_SECRET:}
      sender-number: ${COOLSMS_SENDER_NUMBER:}

  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
      embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
      chat-model: ${GEMINI_CHAT_MODEL:gemini-flash-lite-latest}
      connect-timeout-millis: ${GEMINI_CONNECT_TIMEOUT_MILLIS:3000}
      read-timeout-millis: ${GEMINI_READ_TIMEOUT_MILLIS:20000}
      max-retries: ${GEMINI_MAX_RETRIES:3}
      initial-backoff-millis: ${GEMINI_INITIAL_BACKOFF_MILLIS:500}
