services:
  db:
    image: postgres:16
    container_name: prodio-db
    environment:
      POSTGRES_DB: prodiodb
      POSTGRES_USER: prodio
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    mem_limit: 256m
    restart: unless-stopped

  backend:
    image: ghcr.io/${GITHUB_REPO}/prodio-backend:latest
    container_name: prodio-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/prodiodb
      SPRING_DATASOURCE_USERNAME: prodio
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PRODIO_CORS_ALLOWED_ORIGINS: https://prodio.songkyeongyong.xyz
      PRODIO_CSRF_SECURE_COOKIE: "true"
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    depends_on:
      - db
    mem_limit: 512m
    restart: unless-stopped

  frontend:
    image: ghcr.io/${GITHUB_REPO}/prodio-frontend:latest
    container_name: prodio-frontend
    mem_limit: 256m
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: prodio-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    mem_limit: 64m
    restart: unless-stopped

volumes:
  postgres_data:
